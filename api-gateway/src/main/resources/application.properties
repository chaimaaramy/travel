spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# service-trajets
spring.cloud.gateway.server.webflux.routes[0].id=service-trajets
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-trajets
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/trajets/**

# service-utilisateurs
spring.cloud.gateway.server.webflux.routes[1].id=service-utilisateurs
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-utilisateurs
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# service-reservations
spring.cloud.gateway.server.webflux.routes[2].id=service-reservations
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-reservations
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/reservations/**

# service-paiements
spring.cloud.gateway.server.webflux.routes[3].id=service-paiements
spring.cloud.gateway.server.webflux.routes[3].uri=lb://service-paiements
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/paiements/**

# service-notification
spring.cloud.gateway.server.webflux.routes[4].id=service-notification
spring.cloud.gateway.server.webflux.routes[4].uri=lb://service-notification
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**