server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/reservations_db
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000
spring.cloud.openfeign.circuitbreaker.enabled=false

spring.cache.type=caffeine
spring.cache.cache-names=reservationDetails
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

resilience4j.retry.retryAspectOrder=100
resilience4j.circuitbreaker.circuitBreakerAspectOrder=200
resilience4j.ratelimiter.rateLimiterAspectOrder=300
resilience4j.timelimiter.timeLimiterAspectOrder=400
resilience4j.bulkhead.bulkheadAspectOrder=500

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=500ms
resilience4j.retry.configs.default.retryExceptionPredicate=com.travelbook.servicereservations.resilience.RetryableRemoteCallPredicate

resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.ignoreExceptionPredicate=com.travelbook.servicereservations.resilience.IgnoreClientErrorsPredicate

resilience4j.bulkhead.instances.appelsDistants.maxConcurrentCalls=10
resilience4j.bulkhead.instances.appelsDistants.maxWaitDuration=0s

resilience4j.ratelimiter.instances.reservationDetails.limitForPeriod=5
resilience4j.ratelimiter.instances.reservationDetails.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.reservationDetails.timeoutDuration=0s
resilience4j.ratelimiter.instances.reservationDetails.writableStackTraceEnabled=false